name: Ambientika Local Control
version: "1.2.1"
slug: ambientika_local_control
description: Local control for Ambientika devices with MQTT integration (based on ambientika-local-control by sragas)
url: https://github.com/alexlenk/ambientika-local-control-ha-addon
image: "ghcr.io/alexlenk/ambientika-local-control-ha-addon-{arch}"
arch:
  - aarch64
  - amd64
init: false
host_network: true
ports:
  3000/tcp: 3000
  11000/tcp: 11000
ports_description:
  3000/tcp: REST API port
  11000/tcp: Device communication port
# Assumes rest_api_port is left at its default (3000) — the watchdog's [PORT:3000]
# token maps to the static `ports` entry above, not the configurable rest_api_port
# option, so changing rest_api_port means the watchdog checks the wrong port.
watchdog: "http://[HOST]:[PORT:3000]/health"
options:
  mqtt_host: "core-mosquitto"
  mqtt_port: 1883
  mqtt_username: ""
  mqtt_password: ""
  cloud_sync_enabled: false
  cloud_host: "app.ambientika.eu"
  cloud_port: 11000
  device_stale_timeout: 90
  rest_api_port: 3000
  local_socket_port: 11000
  udp_broadcast_start_port: 45000
  log_level: info
  log_full_serials: false
  enable_raw_commands: false
  rest_api_bind: "0.0.0.0"
  rest_api_token: ""
  enable_debug_endpoints: false
schema:
  mqtt_host: str
  mqtt_port: int(1,65535)
  mqtt_username: str?
  mqtt_password: password?
  cloud_sync_enabled: bool
  cloud_host: str?
  cloud_port: int(1,65535)?
  device_stale_timeout: int(30,300)
  rest_api_port: int(1,65535)
  local_socket_port: int(1,65535)
  udp_broadcast_start_port: int(1,65535)
  log_level: list(silly|debug|info|warn|error)?
  log_full_serials: bool?
  enable_raw_commands: bool?
  rest_api_bind: str?
  rest_api_token: password?
  enable_debug_endpoints: bool?
source_url: https://github.com/sragas/ambientika-local-control
